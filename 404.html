<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://jiayizhang2001.github.io/">
  <meta http-equiv="refresh" content="1; url=https://jiayizhang2001.github.io/">
  <title>Jiayi Zhang's website has moved</title>
  <script>
    (function () {
      var oldBase = "/jiayizhang";
      var path = window.location.pathname;
      if (path.indexOf(oldBase) === 0) path = path.slice(oldBase.length);
      if (!path || path === "/index.html") path = "/";
      var target = "https://jiayizhang2001.github.io" + path + window.location.search + window.location.hash;
      window.location.replace(target);
    }());
  </script>
</head>
<body>
  <p>This website has moved to <a href="https://jiayizhang2001.github.io/">https://jiayizhang2001.github.io/</a>.</p>
</body>
</html>
